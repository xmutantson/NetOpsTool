services:
  netops:
    build: .
    image: netops-tool:local
    container_name: netops_tool
    ports:
      - "5250:5250"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - flask_secret:/run/secrets
    environment:
      - LOG_LEVEL=INFO
      - NETOPS_JWT_SECRET=${NETOPS_JWT_SECRET:?Set a unique JWT secret of at least 32 characters}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set a unique admin password}

volumes:
  flask_secret:
