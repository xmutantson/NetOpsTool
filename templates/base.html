<!-- templates/base.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NetOpsTool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="{{ url_for('static', filename='css/site.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
</head>
<body>
<script>
function textElement(tag, text){
  const el = document.createElement(tag);
  el.textContent = text == null ? '' : String(text);
  return el;
}

async function fetchRows(url, signal){
  const response = await fetch(url, {signal, cache: 'no-store'});
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const rows = await response.json();
  if (!Array.isArray(rows)) throw new Error('Unexpected response');
  return rows;
}

// Serialize refreshes and discard results superseded by a new filter selection.
function createRefreshController({load, render, status, intervalMs = 30000}){
  let active = null, controller = null, queued = false, version = 0;
  let lastUpdated = null, failure = '', stopped = false;
  function showStatus(loading = false){
    const stale = !!failure || (lastUpdated !== null && Date.now() - lastUpdated > intervalMs * 2);
    status.dataset.state = stale ? 'stale' : (loading ? 'loading' : 'current');
    const checked = lastUpdated === null ? 'No successful refresh yet.'
      : `Last refreshed: ${new Date(lastUpdated).toLocaleString()}.`;
    status.textContent = `${stale ? 'Stale data. ' : ''}${failure ? `Refresh failed (${failure}). ` : ''}${checked}${loading ? ' Refreshing…' : ' Auto-refresh every 30s.'}`;
  }
  function request(){
    if (stopped) return Promise.resolve();
    version++;
    queued = true;
    if (active){
      controller?.abort();
      return active;
    }
    active = (async () => {
      while (queued && !stopped){
        queued = false;
        const currentVersion = version;
        controller = new AbortController();
        const currentController = controller;
        let timedOut = false;
        const timeout = setTimeout(() => { timedOut = true; currentController.abort(); }, 15000);
        showStatus(true);
        try {
          const data = await load(currentController.signal);
          if (stopped || currentVersion !== version) continue;
          if (timedOut) throw new Error('request timed out');
          render(data);
          lastUpdated = Date.now();
          failure = '';
        } catch (error){
          if (!stopped && currentVersion === version){
            failure = timedOut ? 'request timed out' : (error.message || 'network error');
          }
        } finally {
          clearTimeout(timeout);
          // Also cancel sibling requests if one resource failed.
          currentController.abort();
        }
        if (!stopped) showStatus();
      }
    })().finally(() => { active = null; });
    return active;
  }
  const poll = setInterval(() => { if (!active) request(); }, intervalMs);
  const freshness = setInterval(() => showStatus(!!active), 5000);
  function stop(){
    stopped = true;
    queued = false;
    controller?.abort();
    clearInterval(poll);
    clearInterval(freshness);
  }
  window.addEventListener('pagehide', event => { if (!event.persisted) stop(); });
  return {request, stop};
}
</script>
<header class="topbar">
  <div class="brand">NetOpsTool</div>
  <nav>
    <a href="{{ url_for('pages.index') }}">Map</a>
    <a href="{{ url_for('pages.stations') }}">Stations</a>
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer class="foot">
  <span>&copy; {{ current_year }} Kameron Markham (KG7VSN)</span>
</footer>
</body>
</html>
